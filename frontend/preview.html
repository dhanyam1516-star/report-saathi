              <div className="relative w-full max-w-[400px] bg-gradient-to-b from-white/25 via-white/15 to-white/10 backdrop-blur-2xl rounded-[2.5rem] border border-white/30 shadow-[0_30px_60px_-15px_rgba(0,0,0,0.5)] p-8 sm:p-10 space-y-6 text-slate-900">
                <button 
                  onClick={() => setIsAuthOpen(false)}
                  className="absolute top-6 right-6 w-8 h-8 rounded-full bg-white/20 hover:bg-white/40 text-slate-800 flex items-center justify-center transition-all border border-white/20"
                >
                  ✕
                </button>

                <div className="pt-2">
                  <h2 className="text-2xl font-black tracking-wider text-slate-900 uppercase">LOGIN</h2>
                </div>

                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  <input
                    type="text"
                    value={authForm.username}
                    onChange={(e) => setAuthForm({ ...authForm, username: e.target.value })}
                    placeholder="Email or username"
                    className="w-full px-5 py-4 bg-white/20 hover:bg-white/25 focus:bg-white/30 border border-white/30 rounded-2xl text-sm font-medium text-slate-900 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-400/50 shadow-inner"
                  />
                  <input
                    type="password"
                    value={authForm.password}
                    onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                    placeholder="Password"
                    className="w-full px-5 py-4 bg-white/20 hover:bg-white/25 focus:bg-white/30 border border-white/30 rounded-2xl text-sm font-medium text-slate-900 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-400/50 shadow-inner"
                  />

                  <div className="flex justify-end">
                    <span className="text-xs text-slate-700 hover:text-slate-950 cursor-pointer">Forgot password?</span>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3.5 rounded-2xl bg-slate-900/80 hover:bg-slate-900 text-white font-bold text-sm shadow-md border border-white/20 transition-all"
                  >
                    Continue
                  </button>
                </form>

                <div className="space-y-4 pt-1 text-center">
                  <div className="text-xs font-bold text-slate-600 tracking-wider">OR</div>
                  <div className="flex items-center justify-center gap-4">
                    <button onClick={() => handleLoginSubmit()} className="w-11 h-11 rounded-full bg-white/80 hover:bg-white border border-white/40 flex items-center justify-center shadow-md font-bold text-sm">G</button>
                    <button onClick={() => handleLoginSubmit()} className="w-11 h-11 rounded-full bg-[#1877F2] text-white flex items-center justify-center shadow-md font-bold text-sm">f</button>
                    <button onClick={() => handleLoginSubmit()} className="w-11 h-11 rounded-full bg-[#1DA1F2] text-white flex items-center justify-center shadow-md font-bold text-sm">𝕏</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Upload Modal */}
          {isUploadOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="w-full max-w-lg bg-white rounded-2xl p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-bold text-slate-900 text-base">Upload Report</h3>
                  <button onClick={() => setIsUploadOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
                </div>
                <div 
                  onClick={() => handleSelectSample('cbc-01')}
                  className="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:bg-slate-50 transition-colors"
                >
                  <p className="text-sm font-semibold text-slate-800">Select PDF, JPG or PNG (Up to 10MB)</p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
